name: NDK build

on:
  push:
    branches: [main, 'dev/*', 'feat/*', 'fix/*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - uses: Fernthedev/qpm-action@v2

      - name: Build and package
        run: qpm2 qpkg --qmod

      - name: Publish QPM release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: Fernthedev/qpm-action@v2
        with:
          publish: now
          publish_token: ${{ secrets.QPM_KEY }}

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp build/libweb-utils.so WebUtils.qmod web-utils.qpkg dist/
          cp build/debug/libweb-utils.so dist/libweb-utils-debug.so
          readelf -n dist/libweb-utils.so | awk '/Build ID:/ {print $3}' > dist/build-id.txt
          test -s dist/build-id.txt
          test "$(cat dist/build-id.txt)" = "$(readelf -n dist/libweb-utils-debug.so | awk '/Build ID:/ {print $3}')"
          cd dist
          sha256sum libweb-utils.so libweb-utils-debug.so WebUtils.qmod web-utils.qpkg build-id.txt > SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WebUtils
          path: dist/
          if-no-files-found: error

      - name: Upload debug library and release metadata
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist/libweb-utils-debug.so dist/build-id.txt dist/SHA256SUMS --clobber
